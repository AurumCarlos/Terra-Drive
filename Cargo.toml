[package]
name = "terra-engine"
version = "0.2.0"
edition = "2021"
description = "Moteur 3D pour planetes entieres generees proceduralement"
default-run = "terra-demo"

[lib]
name = "terra"
path = "src/lib.rs"

[[bin]]
name = "terra-demo"
path = "src/main.rs"

[dependencies]
wgpu = "24"
winit = "0.30"
glam = { version = "0.29", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
png = "0.17"
egui = "0.31"
egui-wgpu = "0.31"
egui-winit = { version = "0.31", default-features = false }
cpal = "0.17"
thiserror = "2"

# La generation du monde doit rester fluide meme en build de developpement.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
